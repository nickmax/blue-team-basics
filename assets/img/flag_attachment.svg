<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Document with a paperclip and a warning sign</title>
  <desc id="desc">A document, a large paperclip and a warning triangle, representing an unexpected email attachment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#292118"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fbf4e8" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="152" cy="404" r="190" fill="#c0451b" opacity="0.16"/>
  <g filter="url(#sh)" transform="rotate(-4 400 250)">
    <path d="M292 104 H472 L548 180 V398 H292 Z" fill="#fbf4e8"/>
    <path d="M472 104 V180 H548" fill="#e8a33d"/>
    <rect x="330" y="222" width="136" height="12" rx="6" fill="#6b6258"/>
    <rect x="330" y="254" width="176" height="12" rx="6" fill="#6b6258" opacity="0.8"/>
    <rect x="330" y="286" width="108" height="12" rx="6" fill="#6b6258" opacity="0.6"/>
  </g>
  <g filter="url(#sh)">
    <path d="M614 190 V322 A42 42 0 0 1 530 322 V208 A27 27 0 0 1 584 208 V312"
          fill="none" stroke="#c0451b" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g filter="url(#sh)">
    <path d="M186 92 L256 214 H116 Z" fill="#e8a33d" stroke="#1c1712" stroke-width="7" stroke-linejoin="round"/>
    <rect x="181" y="133" width="12" height="38" rx="6" fill="#1c1712"/>
    <circle cx="187" cy="188" r="7" fill="#1c1712"/>
  </g>

</svg>
