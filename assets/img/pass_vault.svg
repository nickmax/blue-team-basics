<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Padlock with a combination dial</title>
  <desc id="desc">A navy padlock with a mint combination dial, representing a password manager vault.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18b79c"/>
      <stop offset="1" stop-color="#0e8577"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#effaf7" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="110" cy="440" r="210" fill="#071a2b" opacity="0.18"/>
  <g filter="url(#sh)">
    <path d="M318 232 V196 A82 82 0 0 1 482 196 V232" fill="none" stroke="#071a2b" stroke-width="28"/>
    <rect x="278" y="228" width="244" height="196" rx="28" fill="#071a2b"/>
    <circle cx="400" cy="316" r="56" fill="none" stroke="#a9e8d8" stroke-width="6"/>
    <circle cx="400" cy="316" r="34" fill="none" stroke="#a9e8d8" stroke-width="4" opacity="0.65"/>
    <circle cx="400" cy="316" r="12" fill="#a9e8d8"/>
    <path d="M400 316 V348" stroke="#a9e8d8" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g fill="#effaf7" opacity="0.75">
    <circle cx="642" cy="128" r="8"/><circle cx="682" cy="182" r="5"/><circle cx="606" cy="196" r="6"/>
  </g>

</svg>
