<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Radar screen with connected devices</title>
  <desc id="desc">A radar screen with rings, a sweep and connected nodes, representing endpoint detection and response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22382c"/>
      <stop offset="1" stop-color="#182a20"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#dde6d2" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <g fill="none" stroke="#dde6d2" stroke-width="2" opacity="0.30">
    <circle cx="400" cy="260" r="72"/><circle cx="400" cy="260" r="130"/>
    <circle cx="400" cy="260" r="188"/><circle cx="400" cy="260" r="246"/>
    <path d="M400 14 V506"/><path d="M154 260 H646"/>
  </g>
  <path d="M400 260 L400 72 A188 188 0 0 1 521 116 Z" fill="#b4552d" opacity="0.24"/>
  <circle cx="400" cy="260" r="8" fill="#f8f5ea"/>
  <g fill="#dde6d2">
    <circle cx="492" cy="176" r="9"/><circle cx="312" cy="316" r="7"/><circle cx="470" cy="352" r="8"/>
  </g>
  <g fill="none" stroke="#dde6d2" stroke-width="2" opacity="0.55">
    <path d="M400 260 L492 176"/><path d="M400 260 L312 316"/><path d="M400 260 L470 352"/>
    <path d="M492 176 L470 352"/>
  </g>
  <rect x="470" y="160" width="44" height="32" rx="6" fill="#dde6d2" opacity="0.9"/>
  <rect x="484" y="168" width="16" height="16" rx="3" fill="#22382c"/>

</svg>
