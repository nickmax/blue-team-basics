<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Chain links beside a browser address bar</title>
  <desc id="desc">A browser address bar above overlapping chain links and a mouse cursor, representing a lookalike link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="1" stop-color="#f2e2c9"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1c1712" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <g filter="url(#sh)">
    <rect x="166" y="68" width="468" height="60" rx="30" fill="#1c1712"/>
    <circle cx="203" cy="98" r="11" fill="#e8a33d"/>
    <rect x="232" y="92" width="196" height="12" rx="6" fill="#fbf4e8" opacity="0.82"/>
    <rect x="446" y="92" width="104" height="12" rx="6" fill="#c0451b"/>
  </g>
  <g transform="rotate(-38 400 300)" filter="url(#sh)">
    <rect x="244" y="238" width="186" height="98" rx="49" fill="none" stroke="#1c1712" stroke-width="27"/>
    <rect x="356" y="238" width="186" height="98" rx="49" fill="none" stroke="#c0451b" stroke-width="27"/>
    <rect x="468" y="238" width="152" height="98" rx="49" fill="none" stroke="#1c1712" stroke-width="27"/>
  </g>
  <g filter="url(#sh)">
    <path d="M548 330 L548 428 L575 402 L594 448 L616 438 L597 394 L634 392 Z"
          fill="#fbf4e8" stroke="#1c1712" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <circle cx="676" cy="236" r="34" fill="#e8a33d"/>

</svg>
