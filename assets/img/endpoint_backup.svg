<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Disk stack syncing to a cloud</title>
  <desc id="desc">Three stacked disks with an arrow pointing to a cloud outline, representing regular backups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ea"/>
      <stop offset="1" stop-color="#ece6d4"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#6f8560" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="120" cy="80" r="200" fill="#dde6d2" opacity="0.8"/>
  <g filter="url(#sh)">
    <ellipse cx="310" cy="346" rx="138" ry="34" fill="#22382c"/>
    <rect x="172" y="312" width="276" height="36" fill="#22382c"/>
    <ellipse cx="310" cy="312" rx="138" ry="34" fill="#6f8560"/>
    <ellipse cx="310" cy="312" rx="138" ry="34" fill="none" stroke="#22382c" stroke-width="4"/>
    <rect x="172" y="252" width="276" height="36" fill="#22382c"/>
    <ellipse cx="310" cy="252" rx="138" ry="34" fill="#6f8560"/>
    <ellipse cx="310" cy="252" rx="138" ry="34" fill="none" stroke="#22382c" stroke-width="4"/>
    <rect x="172" y="192" width="276" height="36" fill="#22382c"/>
    <ellipse cx="310" cy="192" rx="138" ry="34" fill="#6f8560"/>
    <ellipse cx="310" cy="192" rx="138" ry="34" fill="none" stroke="#22382c" stroke-width="4"/>
    <ellipse cx="310" cy="192" rx="52" ry="13" fill="#f8f5ea" opacity="0.7"/>
  </g>
  <path d="M466 256 C520 256 526 306 570 306" fill="none" stroke="#b4552d" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>
  <path d="M546 288 L572 306 L542 320" fill="none" stroke="#b4552d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#sh)">
    <path d="M588 172 A44 44 0 0 1 664 178 A36 36 0 0 1 660 248 H602 A40 40 0 0 1 588 172 Z" fill="#dde6d2" stroke="#22382c" stroke-width="7"/>
  </g>

</svg>
