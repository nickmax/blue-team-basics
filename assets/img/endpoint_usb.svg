    <rect x="300" y="240" width="86" height="8" rx="4" fill="#6f8560" opacity="0.55"/>
    <rect x="300" y="260" width="60" height="8" rx="4" fill="#6f8560" opacity="0.35"/>
    <circle cx="436" cy="262" r="16" fill="#dde6d2" stroke="#6f8560" stroke-width="4"/>
    <rect x="508" y="232" width="104" height="60" rx="8" fill="#22382c"/>
    <rect x="536" y="248" width="18" height="12" rx="3" fill="#f8f5ea"/>
    <rect x="566" y="248" width="18" height="12" rx="3" fill="#f8f5ea"/>
    <rect x="536" y="268" width="18" height="12" rx="3" fill="#f8f5ea"/>
    <rect x="566" y="268" width="18" height="12" rx="3" fill="#f8f5ea"/>
  </g>
  <g fill="none" stroke="#f8f5ea" stroke-width="6" stroke-linecap="round" opacity="0.85">
