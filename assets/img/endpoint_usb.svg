<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">USB connector with a warning sign</title>
  <desc id="desc">A USB connector with a cable and a warning triangle, representing infected removable media.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4552d"/>
      <stop offset="1" stop-color="#8f3f1c"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f8f5ea" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="700" cy="430" r="220" fill="#22382c" opacity="0.16"/>
  <path d="M120 340 C220 340 200 250 292 250" fill="none" stroke="#f8f5ea" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  <g filter="url(#sh)">
