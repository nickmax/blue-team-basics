<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Envelope with a clock</title>
  <desc id="desc">An envelope with a clock face in the corner, representing a message that demands an immediate response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0451b"/>
      <stop offset="1" stop-color="#8f2f0f"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fbf4e8" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="672" cy="48" r="230" fill="#1c1712" opacity="0.16"/>
  <g stroke="#fbf4e8" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M110 300 H180"/><path d="M86 336 H168"/><path d="M120 372 H180"/>
  </g>
  <g filter="url(#sh)">
    <rect x="238" y="168" width="324" height="212" rx="18" fill="#fbf4e8"/>
    <path d="M238 185 L400 312 L562 185" fill="none" stroke="#1c1712" stroke-width="9" stroke-linejoin="round"/>
    <path d="M238 358 L352 272" fill="none" stroke="#c0451b" stroke-width="7" stroke-linecap="round"/>
    <path d="M562 358 L448 272" fill="none" stroke="#c0451b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="626" cy="118" r="66" fill="#e8a33d" stroke="#1c1712" stroke-width="8"/>
    <path d="M626 80 V120 L654 136" fill="none" stroke="#1c1712" stroke-width="8" stroke-linecap="round"/>
    <circle cx="626" cy="118" r="7" fill="#1c1712"/>
  </g>

</svg>
