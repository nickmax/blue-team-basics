<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Clip-on identification badge</title>
  <desc id="desc">A generic identification badge with a lanyard, used to represent an attacker pretending to be an authority figure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#2c241c"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fbf4e8" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="110" cy="86" r="210" fill="#c0451b" opacity="0.18"/>
  <g filter="url(#sh)" transform="rotate(-5 400 270)">
    <path d="M338 40 L378 176" stroke="#e8a33d" stroke-width="16" stroke-linecap="round"/>
    <path d="M462 40 L422 176" stroke="#e8a33d" stroke-width="16" stroke-linecap="round"/>
    <rect x="245" y="162" width="310" height="230" rx="22" fill="#fbf4e8"/>
    <circle cx="400" cy="244" r="52" fill="#c0451b"/>
    <circle cx="400" cy="234" r="17" fill="#fbf4e8"/>
    <path d="M372 282 a28 28 0 0 1 56 0" fill="#fbf4e8"/>
    <rect x="298" y="314" width="204" height="12" rx="6" fill="#6b6258"/>
    <rect x="328" y="340" width="144" height="10" rx="5" fill="#6b6258" opacity="0.62"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="616" cy="352" r="64" fill="#e8a33d"/>
    <rect x="609" y="322" width="14" height="36" rx="7" fill="#1c1712"/>
    <circle cx="616" cy="374" r="8" fill="#1c1712"/>
  </g>

</svg>
