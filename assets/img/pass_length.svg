<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Two bars comparing a short password with a long passphrase</title>
  <desc id="desc">A short grey bar above a long mint bar with ruler ticks, showing that length adds strength.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#0d2b3e"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#a9e8d8" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <circle cx="740" cy="40" r="240" fill="#18b79c" opacity="0.14"/>
  <rect x="170" y="188" width="150" height="52" rx="26" fill="#4d6b7a"/>
  <rect x="170" y="286" width="430" height="52" rx="26" fill="#a9e8d8"/>
  <g stroke="#a9e8d8" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M170 372 V390"/><path d="M230 372 V384"/><path d="M290 372 V390"/>
    <path d="M350 372 V384"/><path d="M410 372 V390"/><path d="M470 372 V384"/>
    <path d="M530 372 V390"/><path d="M590 372 V384"/>
  </g>
  <g stroke="#a9e8d8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M656 214 V300"/><path d="M644 226 L656 214 L668 226"/><path d="M644 288 L656 300 L668 288"/>
  </g>
  <g transform="translate(648 96)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#18b79c" stroke-width="9"/>
    <path d="M0 26 V64" stroke="#18b79c" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 48 H16" stroke="#18b79c" stroke-width="9" stroke-linecap="round"/>
  </g>

</svg>
