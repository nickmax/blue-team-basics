<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Phone showing a verification code beside a shield</title>
  <desc id="desc">A phone displaying six code boxes and a shield with a check mark, representing multi-factor authentication.</desc>
  <defs>
