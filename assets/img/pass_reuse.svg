<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Three cards with identical keys</title>
  <desc id="desc">Three account cards each holding the same key, illustrating password reuse across accounts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effaf7"/>
      <stop offset="1" stop-color="#dcefe8"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#071a2b" opacity="0.30"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  
  <g transform="rotate(-9 250 300)" filter="url(#sh)">
    <rect x="120" y="220" width="196" height="164" rx="18" fill="#071a2b"/>
    <g transform="translate(218 266)" stroke="#a9e8d8" stroke-width="8" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-8" r="16"/>
      <path d="M0 8 V52"/><path d="M0 38 H16"/><path d="M0 52 H12"/>
    </g>
  </g>
  <g transform="rotate(2 400 300)" filter="url(#sh)">
    <rect x="302" y="200" width="196" height="184" rx="18" fill="#0d2b3e" stroke="#18b79c" stroke-width="4"/>
    <g transform="translate(400 250)" stroke="#a9e8d8" stroke-width="8" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-8" r="16"/>
      <path d="M0 8 V52"/><path d="M0 38 H16"/><path d="M0 52 H12"/>
    </g>
  </g>
  <g transform="rotate(12 550 300)" filter="url(#sh)">
    <rect x="484" y="220" width="196" height="164" rx="18" fill="#071a2b"/>
    <g transform="translate(582 266)" stroke="#a9e8d8" stroke-width="8" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-8" r="16"/>
      <path d="M0 8 V52"/><path d="M0 38 H16"/><path d="M0 52 H12"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <path d="M400 96 L456 196 H344 Z" fill="#4d6b7a"/>
    <rect x="394" y="128" width="12" height="34" rx="6" fill="#effaf7"/>
    <circle cx="400" cy="178" r="7" fill="#effaf7"/>
  </g>

</svg>
